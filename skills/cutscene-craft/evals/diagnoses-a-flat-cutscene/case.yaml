schema_version: "1.1"
name: diagnoses-a-flat-cutscene
context:
  scaffold_script: place-files.sh
expected_outcome: |
  A list of weak points ordered by how much each hurts, with no scores, and with the missing clash
  of wants or the missing change among the first three. Each item says where it is in the script,
  what is wrong, what the audience or the player loses, and a concrete change; where the fault is
  a line, the change is a redrafted line. The list covers at least seven of these: the cutscene
  shows the driving and winching that the player could have played; the east drift, which the
  player must know to play on, is given only in a cutscene that can be skipped; lines say what the
  picture already shows (driving through the water, the man waving, the water rising); nobody's
  wants collide and nothing has changed by the end; feelings and a lesson are named outright
  (relieved, frightened, proud, scared, "I've learned"); the old flood is told to Hale, who knows
  it; the three speak in one voice or in stock lines ("We don't have much time!", "Stay with
  me!"); the lines are far too many words for 40 seconds, or line 5 is too long to say or caption;
  the closing line sums up what the scene meant. The words are counted against the 40 seconds.
  cutscene.md is left unchanged.
