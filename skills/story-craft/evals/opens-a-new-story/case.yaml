schema_version: "1.1"
name: opens-a-new-story
expected_outcome: |
  opening.md holds a scene of roughly 400 words that begins inside an action already underway,
  not on description, waking, travel, or backstory. Something in the scene forces one of the two
  to act now. The keeper and her brother want things that cannot both be met, and neither states
  their feelings or their history outright. The scene ends on its turn, without a closing
  paragraph that sums up what it meant. The file holds only the story. The reply adds a note of at
  most five lines saying where each test is met or set aside.
